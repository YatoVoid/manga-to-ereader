[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manga-to-ereader"
version = "0.1.0"
description = "Pack downloaded manga chapters into one ordered .cbz per volume, ready for e-reader conversion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
tankobon = "tankobon.cli:main"

[project.gui-scripts]
tankobon-gui = "tankobon.gui:entry"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tankobon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
