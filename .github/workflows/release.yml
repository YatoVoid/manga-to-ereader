name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[gui]" pytest "pyinstaller>=6.6"
      - run: python -m pytest -q
      - name: Build Tankobon.exe (desktop app)
        run: pyinstaller --noconfirm --onefile --windowed --name Tankobon packaging/tankobon-gui.py
      - name: Build tankobon-cli.exe (command line)
        run: pyinstaller --noconfirm --onefile --console --exclude-module PySide6 --name tankobon-cli packaging/tankobon-cli.py
      - name: Check the CLI exe runs
        run: dist/tankobon-cli.exe --version
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Tankobon.exe
            dist/tankobon-cli.exe
